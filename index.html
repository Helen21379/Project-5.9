<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iintoo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="page">
     <section class="page-image">
       <img src="images/image.jpg" alt="illustration">
     </section>
     <section class="page-form">
        <h1>Get iintoo it today</h1>
        <p class="subtitle">There is no charge or obligation upon registration.</p>
     <div class="social">
         <button class="btn btn--fb">Register with Facebook</button>
         <button class="btn btn--in">Register with LinkedIn</button>
     </div>
     <div class="divider">OR</div>
     <form>
     <div class="inputs">  
        <div class="field field--email">
        <label>Email</label>
          <input type="email">
     </div>
     <div class="field field--phone">
        <label>Phone</label>
          <input type="tel"> 
     </div>
     </div>
     <h2>What type of investor are you?</h2>
          <p class="subtitle">Select the type of investor you are below</p>
     <div class="radio-group">
        <label class="radio-item">
                <input type="radio" name="investor" checked>
                <span class="radio-text">Individual</span>
                <span class="info-item">
                <span class="info-icon">i</span>
                <span class="tooltip">I am a natural person investing on my own behalf as a sole owner, joint tenant or tenant in common.</span>
                </span>     
        </label>

        <label class="radio-item">
                <input type="radio" name="investor">
                <span class="radio-text">Business</span>
                <span class="info-item">
                   <span class="info-icon">i</span>
                   <span class="tooltip">I am a natural person investing on my own behalf as a sole owner, joint tenant or tenant in common.</span>
                </span>      
        </label>

        <label class="radio-item">
                <input type="radio" name="investor">
                <span class="radio-text">IRA</span>
                <span class="info-item">
                <span class="info-icon">i</span>
                <span class="tooltip">I am a natural person investing on my own behalf as a sole owner, joint tenant or tenant in common.</span>
                </span>      
        </label>

        <label class="radio-item">
                <input type="radio" name="investor">
                <span class="radio-text">Trust</span>
                <span class="info-item">
                <span class="info-icon">i</span>
                <span class="tooltip">I am a natural person investing on my own behalf as a sole owner, joint tenant or tenant in common.</span>
                </span>     
        </label>
 </div>
      
     <label class="terms">
                <input type="checkbox">I agree to the terms and receiving notifications from iintoo<a href="#">View full terms</a>
       </label>   
       <button class="btn btn--submit">Create Account</button>
    </form>

    </section>
    </main>

    </body>
    </html>
